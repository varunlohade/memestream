<!doctype html>
<meta charset="utf-8">
<title>memestream pixel mock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;600;700&display=block">
<style>
*{box-sizing:border-box;margin:0;padding:0}
.num{font-variant-numeric:tabular-nums}
canvas,.px{image-rendering:pixelated}
canvas.scene{display:block;width:100%;height:100%}

/* ---------- themes ---------- */
body.A{--panel:#C6C6C6;--fg:#262626;--mute:#555;--hi:#FFFFFF;--lo:#555555;--edge:#000;--slot:#8B8B8B;--slothi:#FFFFFF;--slotlo:#373737;--up:#2E8B22;--down:#B02E26;--xp:#80FF20;--btn:#6F6F6F;--buy:#3C8527;--hf:"Press Start 2P";--bf:"VT323";--hs:.6}
body.B{--panel:#2C2C30;--fg:#EDEDED;--mute:#9A9AA2;--hi:#4A4A50;--lo:#161618;--edge:#000;--slot:#1C1C1F;--slothi:#3E3E44;--slotlo:#0B0B0C;--up:#5CFF6A;--down:#FF5A4E;--xp:#80FF20;--btn:#3E3E44;--buy:#17A34A;--hf:"Silkscreen";--bf:"VT323";--hs:1}
body.C{--panel:#E3C99A;--fg:#2E1F0E;--mute:#5A4127;--hi:#D9B77F;--lo:#6B5130;--edge:#2E1F0E;--slot:#7A5C34;--slothi:#C9A46B;--slotlo:#4A3620;--up:#1F6E12;--down:#9E2219;--xp:#FCDB05;--btn:#7F7F7F;--buy:#1E9E3E;--hf:"Pixelify Sans";--bf:"Pixelify Sans";--hs:1}
body{color:var(--fg);font-family:var(--bf),monospace;background-color:#3a2a1d;background-size:96px 96px;image-rendering:pixelated;min-height:100vh}
body.B{background-color:#18181a}
body.C{background:#8FC7F2}

h1,h2,h3,.hf{font-family:var(--hf),monospace;font-weight:400}
body.C h1,body.C h2,body.C h3,body.C .hf{font-weight:600}

/* bevelled block panel */
.p{background:var(--panel);border:4px solid var(--edge);box-shadow:inset 4px 4px 0 var(--hi),inset -4px -4px 0 var(--lo);padding:22px}
body.C .p{background-size:128px 128px}
.slot{background:var(--slot);box-shadow:inset 4px 4px 0 var(--slotlo),inset -4px -4px 0 var(--slothi)}
.mbtn{display:flex;align-items:center;justify-content:center;height:60px;background:var(--btn);border:4px solid #000;box-shadow:inset 4px 4px 0 rgba(255,255,255,.4),inset -4px -6px 0 rgba(0,0,0,.4);color:#fff;font-family:var(--hf),monospace;font-size:calc(18px*var(--hs) + 2px);text-shadow:3px 3px 0 rgba(0,0,0,.5)}
body.C .mbtn{font-weight:700;font-size:24px}
.mbtn.buy{background:var(--buy)}
.up{color:var(--up)}.down{color:var(--down)}
.mute{color:var(--mute)}

/* XP-style bar */
.xpw{position:relative;padding-top:30px}
.xpn{position:absolute;left:50%;top:0;transform:translateX(-50%);font-family:var(--hf),monospace;font-size:calc(22px*var(--hs) + 4px);color:var(--xp);-webkit-text-stroke:6px #000;paint-order:stroke fill;line-height:1}
body.C .xpn{font-weight:600;font-size:32px;-webkit-text-stroke:4px #000}
body.A .xpn{font-size:22px;-webkit-text-stroke:7px #000}
.xp{height:24px;background:#1A1A1A;border:4px solid #000;position:relative;overflow:hidden}
.xp b{display:block;height:100%;background:var(--xp);box-shadow:inset 0 4px 0 rgba(255,255,255,.45),inset 0 -4px 0 rgba(0,0,0,.25)}
.xp i{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(5.555% - 4px),#000 calc(5.555% - 4px) 5.555%)}
.xp.sm{height:16px;border-width:3px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;height:88px;padding:0 40px;border-bottom:4px solid #000;background-size:64px 64px}
.brand{display:flex;align-items:center;gap:14px;font-family:var(--hf),monospace;font-size:calc(18px*var(--hs) + 6px);color:#fff;text-shadow:3px 3px 0 #000}
body.C .brand{font-weight:400;font-size:28px}
.brand canvas{width:40px;height:40px}
.net{font-family:var(--bf),monospace;font-size:22px;color:#fff;background:#000;padding:2px 10px}
.wallet{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px 0 10px;font-size:24px;color:#fff;background:rgba(0,0,0,.55);border:4px solid #000}
.wallet canvas{width:28px;height:28px}

/* coin page */
.coin{display:grid;grid-template-columns:1fr 440px;gap:32px;padding:32px 40px 40px}
.embed{position:relative;aspect-ratio:16/9;border:4px solid #000}
.live{position:absolute;left:16px;top:16px;background:#C62828;color:#fff;font-family:var(--hf),monospace;font-size:calc(12px*var(--hs) + 4px);padding:6px 10px;border:3px solid #000}
.ident{display:flex;gap:18px;align-items:center}
.ident .slot{width:84px;height:84px;padding:8px;flex:none}
.ident h1{font-size:calc(26px*var(--hs) + 10px)}
body.C .ident h1{font-size:40px}
.ident p{font-size:26px;margin-top:6px}
body.C .ident p{font-size:20px}
.lbl{font-size:24px}
body.C .lbl{font-size:18px}
.cap{font-family:var(--hf),monospace;font-size:calc(34px*var(--hs) + 12px);margin-top:8px;line-height:1.05}
body.C .cap{font-size:56px;font-weight:700}
.chg{font-size:26px;margin-top:4px}
body.C .chg{font-size:20px;font-weight:600}
.chart{margin-top:14px;height:120px}
.chart canvas{width:100%;height:100%;display:block}
.fees{display:flex;align-items:center;gap:12px;margin-top:18px;padding:10px 12px;font-size:26px;background:rgba(0,0,0,.12)}
body.B .fees{background:rgba(255,255,255,.06)}
body.C .fees{font-size:19px;font-weight:600;background:rgba(0,0,0,.15)}
.fees canvas{width:32px;height:32px;flex:none}
.gradlbl{display:flex;justify-content:space-between;font-size:24px;margin-top:20px}
body.C .gradlbl{font-size:18px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.tabs .mbtn{height:52px}
.tabs .off{background:#3a3a3a;color:#aaa;text-shadow:none}
.amt{display:flex;align-items:center;justify-content:space-between;height:68px;padding:0 20px;font-size:40px;color:#fff;text-shadow:3px 3px 0 #3f3f3f}
body.C .amt{font-size:32px;font-weight:600}
.amt small{font-size:26px;color:#ddd}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 14px}
.chips span{height:52px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;text-shadow:2px 2px 0 #3f3f3f}
body.C .chips span{font-size:20px;font-weight:600}
.get{display:flex;justify-content:space-between;font-size:26px;margin-bottom:14px}
body.C .get{font-size:19px}
.trades{margin-top:28px}
.trades h3{font-size:calc(16px*var(--hs) + 6px);margin-bottom:12px}
body.C .trades h3{font-size:24px}
.tr{display:grid;grid-template-columns:80px 1fr 1fr 1fr 90px;font-size:26px;padding:8px 0;border-top:4px solid rgba(0,0,0,.18)}
body.B .tr{border-top-color:rgba(255,255,255,.07)}
body.C .tr{font-size:19px;padding:10px 0}
.tr .r{text-align:right}

/* home */
.home{padding:32px 40px 40px}
.hero{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.hero h1{font-size:calc(30px*var(--hs) + 14px);color:#fff;text-shadow:4px 4px 0 #000}
body.C .hero h1{font-size:56px}
.hero p{font-size:30px;color:#fff;margin-top:10px;text-shadow:2px 2px 0 #000}
body.C .hero p{font-size:22px;font-weight:600;color:#2E1F0E;text-shadow:none}
body.C .hero h1{color:#fff}
.hero .mbtn{width:260px;background:var(--buy)}
.sort{display:flex;gap:10px;margin-bottom:18px}
.sort .mbtn{height:48px;padding:0 18px;font-size:calc(12px*var(--hs) + 6px)}
body.C .sort .mbtn{font-size:18px}
.sort .off{background:#3a3a3a;color:#bbb;text-shadow:none}
.row{display:grid;grid-template-columns:140px 1.5fr 1fr .7fr 1.4fr;align-items:center;gap:24px;padding:14px 0;border-top:4px solid rgba(0,0,0,.18)}
.row:first-child{border-top:0;padding-top:0}
.row .slot{width:140px;height:84px;padding:6px}
.row h4{font-family:var(--hf),monospace;font-weight:400;font-size:calc(14px*var(--hs) + 8px)}
body.C .row h4{font-weight:700;font-size:24px}
.row p{font-size:24px;margin-top:4px}
body.C .row p{font-size:17px}
.row .m{font-family:var(--hf),monospace;font-size:calc(14px*var(--hs) + 8px);text-align:right}
body.C .row .m{font-weight:700;font-size:24px}
.row .c{font-size:28px;text-align:right}
body.C .row .c{font-size:20px;font-weight:600}
.row .g{font-size:22px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.tile{padding:14px}
.tile .slot{aspect-ratio:16/9;padding:6px;position:relative}
.tile .meta{display:flex;justify-content:space-between;align-items:flex-end;margin:14px 0 12px}
.tile h4{font-family:var(--hf),monospace;font-weight:400;font-size:22px}
.tile p{font-size:24px;margin-top:4px}
.tile .live{left:14px;top:14px}

/* go live */
.form{max-width:640px;margin:36px auto 40px}
.form h1{font-size:calc(26px*var(--hs) + 12px)}
body.C .form h1{font-size:48px}
.form .sub{font-size:28px;margin:10px 0 24px}
body.C .form .sub{font-size:20px}
.f{margin-bottom:18px}
.f label{display:block;font-size:26px;margin-bottom:6px}
body.C .f label{font-size:19px;font-weight:600}
.f .in{height:60px;display:flex;align-items:center;padding:0 18px;font-size:30px;color:#fff;text-shadow:2px 2px 0 #3f3f3f}
body.C .f .in{font-size:22px}
.f .ph{color:#d8d8d8;text-shadow:none;opacity:.8}
.two{display:grid;grid-template-columns:170px 1fr;gap:20px}
.drop{width:170px;height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;font-size:24px;text-align:center;line-height:1}
body.C .drop{font-size:17px}
.drop canvas{width:48px;height:48px}
.earn{display:flex;gap:14px;align-items:center;font-size:26px;margin:6px 0 20px;padding:14px;background:rgba(0,0,0,.12)}
body.B .earn{background:rgba(255,255,255,.06)}
body.C .earn{font-size:19px;font-weight:600;background:rgba(0,0,0,.15)}
.earn canvas{width:40px;height:40px;flex:none}

/* ---------- OBS overlay (style B). Real overlay page: transparent body, no .ovbg ---------- */
body.ov{width:1920px;height:1080px;overflow:hidden;position:relative;background:transparent;min-height:0}
.ovbg{position:absolute;inset:0;width:1920px;height:1080px}
body.ov .xpn{font-size:34px;-webkit-text-stroke:8px #000}
body.ov .xp{height:30px}
body.ov .xp.big{height:36px}
body.ov .slot canvas{width:100%;height:100%}
.ovA{position:absolute;left:40px;bottom:40px;width:600px;padding:22px 26px}
.ovA .oh{display:grid;grid-template-columns:76px 1fr auto;gap:18px;align-items:center;margin-bottom:16px}
.ovA .slot{width:76px;height:76px;padding:12px}
.ovA .tk{font-size:32px}
.ovA .where{font-size:28px;color:var(--mute);margin-top:6px}
.ovA .r{text-align:right}
.ovA .mc{font-size:36px}
.ovA .ch{font-size:32px;margin-top:4px}
.ovA .gl{font-size:28px;text-align:center;margin-top:8px;color:var(--mute)}
.ovB{position:absolute;left:40px;top:32px;right:40px;display:flex;align-items:center;gap:26px;padding:14px 22px}
.ovB .slot{width:64px;height:64px;padding:10px;flex:none}
.ovB .tk{font-size:30px}
.ovB .mc{font-size:30px}
.ovB .ch{font-size:32px}
.ovB .w{flex:1}
.ovB .w .xpw{padding-top:0;display:flex;align-items:center;gap:16px;flex-direction:row-reverse}
.ovB .w .xpn{position:static;transform:none;font-size:28px}
.ovB .w .xp{flex:1}
.ovB .where{font-size:28px;color:var(--mute)}
.ovC{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);width:1080px}
.ovC .xpw{padding-top:44px}
.ovC .hot{display:grid;grid-template-columns:1.1fr 1fr .8fr 1.4fr;margin-top:10px;border:4px solid #000;background:#000;gap:4px}
.ovC .hot .slot{height:84px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:30px;color:#fff;background:#2C2C30;box-shadow:inset 4px 4px 0 #4A4A50,inset -4px -4px 0 #161618}
.ovC .hot .slot canvas{width:44px;height:44px;flex:none}
.ovC .hot .hf{font-size:26px}
.ovC .hot .s4 span{font-size:30px;color:#C9C9CF}
.wm{font-family:"VT323",monospace;font-size:44px;letter-spacing:.01em;line-height:1;text-transform:none}
body.wm1 .wm{font-family:var(--hf),monospace;font-size:inherit}
@media (max-width:520px){.top{padding:0 16px;height:72px}.brand{gap:10px}.brand canvas{width:32px;height:32px}.wm{font-size:38px}.net{font-size:18px;padding:1px 6px}.wallet{height:48px;width:48px;padding:0;justify-content:center}.wallet span{display:none}}

/* Unverified badge options (?unv=A|B|C) */
.tile .tags{position:absolute;left:14px;top:14px;display:flex;gap:8px;align-items:center}
.tile .tags .live{position:static}
.unvtag{position:relative;display:inline-flex;align-items:center;vertical-align:middle;margin-left:14px;background:#3E3E44;color:#D8D8DC;font-family:"VT323",monospace;font-size:24px;line-height:1;padding:5px 10px 4px;border:3px solid #000;letter-spacing:0}
.tile .tags .unvtag{margin-left:0;font-size:22px}
.unvic{position:relative;display:inline-block;vertical-align:middle;margin-left:12px}
.unvic canvas{width:27px;height:27px;display:block}
h1 .unvic canvas{width:36px;height:36px}
.tip{position:absolute;left:0;top:calc(100% + 10px);width:440px;z-index:5;background:#111113;color:#EDEDED;font-family:"VT323",monospace;font-size:24px;line-height:1.15;letter-spacing:0;padding:12px 14px;border:4px solid #000;box-shadow:inset 3px 3px 0 #3E3E44,inset -3px -3px 0 #0B0B0C;text-transform:none;white-space:normal}
.unvline{font-size:24px!important;color:var(--mute);margin-top:4px!important}
.m2{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;gap:16px}
.m2 h4{display:flex;align-items:center}
.r2{margin:4px 0 12px}
.r2 p{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r2 .unvw{color:var(--mute);flex:none}

/* Ticker tape options (?tape=A|B|C) */
.tape{height:48px;background:#111113;border-bottom:4px solid #000;overflow:hidden;display:flex;align-items:center}
.trow{display:flex;align-items:center;gap:22px;white-space:nowrap;padding-left:40px;font-family:"VT323",monospace;font-size:26px;color:#EDEDED}
.ti{display:inline-flex;align-items:center;gap:10px;color:inherit;text-decoration:none}
.ti b{font-weight:400;color:#fff}
.tsep{display:inline-block;width:6px;height:6px;background:#5A5A62;flex:none}
.tthumb{display:inline-block;width:32px;height:18px;border:2px solid #000}
.tthumb canvas{width:100%;height:100%;display:block}
.ti canvas[data-spr]{width:22px;height:22px}
.ti.grad{color:#80FF20}.ti.grad b{color:#80FF20}
.tbar{display:inline-block;width:90px;height:12px;background:#1A1A1A;border:2px solid #000;position:relative;overflow:hidden}
.tbar b{display:block;height:100%;background:#80FF20}
.xpt{color:#80FF20}
@media (max-width:520px){html,body{overflow-x:hidden;max-width:100vw}.tape{max-width:100vw}body.B .home{display:none}.trow{padding-left:16px;font-size:22px;gap:16px}.tape{height:40px}.tbar{width:60px}}

/* Prediction panel options (?pm=A|B|C), free points only */
.pm .pq{font-size:28px;color:#fff;line-height:1.1}
.pm .pclock{font-size:22px;margin:6px 0 16px}
.pm .prow{display:flex;justify-content:space-between;font-size:24px;margin:8px 0}
.pm .pamt{margin:14px 0}
.pm .mbtn.no{background:#B3261E}
.pm .mbtn.sy,.pm .mbtn.sn{background:#3E3E44}
.pm .mbtn.sy{color:#5CFF6A}.pm .mbtn.sn{color:#FF5A4E}
.pfree{font-size:22px;color:var(--mute);text-align:center;margin-top:14px}
.split{height:24px;border:4px solid #000;background:#FF5A4E;position:relative;overflow:hidden;margin-top:6px}
.split b{display:block;height:100%;background:#5CFF6A}
.pm h3{font-size:22px;margin-bottom:10px}
.lbr{display:grid;grid-template-columns:36px 1fr auto;font-size:24px;padding:6px 0;border-top:4px solid rgba(255,255,255,.07)}
.lbr.you{color:#80FF20}
.ptabs{display:flex;gap:18px;margin-bottom:14px;font-size:16px}
.ptabs span{color:var(--mute);padding-bottom:6px}.ptabs .on{color:#fff;border-bottom:4px solid #80FF20}
.pm .xpw{margin-top:4px}.pm .xpn{font-size:24px}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcs{position:relative;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:30px;color:#fff;overflow:hidden}
.pcs b{position:absolute;left:4px;top:4px;bottom:4px;opacity:.35}
.pcs b.y{background:#5CFF6A}.pcs b.n{background:#FF5A4E}
.pcs span{position:relative}
.lbline{display:flex;align-items:center;gap:12px;font-size:22px;margin-top:16px;padding-top:12px;border-top:4px solid rgba(255,255,255,.07);white-space:nowrap}

.pmA{display:grid;grid-template-columns:1.35fr 1fr;gap:24px;margin-top:24px;align-items:start}
.pmB,.pmC{margin-top:24px}
.pcols{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.pm .mbtn.sy,.pm .mbtn.sn{background:#1C1C1F;text-shadow:none}
.pmC .pc{max-width:560px}

/* Streamer-question predictions (?pm2=A|B|C&role=viewer|streamer) */
.small{font-size:20px}
.phead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}.phead span{font-size:22px;color:var(--mute)}
.mk{padding:14px 0;border-top:4px solid rgba(255,255,255,.07)}
.mk .mq{font-size:26px;color:#fff;line-height:1.1}
.mk.card .split{margin:10px 0 2px}
.mk .tabs{margin:10px 0 0}
.pmA2{display:grid;grid-template-columns:1.35fr 1fr;gap:24px;margin-top:24px;align-items:start}
.pmB2,.pmC2{margin-top:24px}
.subh{font-size:22px;color:var(--mute);margin:6px 0 4px}
.rr{display:grid;grid-template-columns:1fr auto 150px;gap:12px;align-items:center;font-size:23px;padding:6px 0}
.otag{font-size:20px;padding:2px 8px;border:3px solid #000;line-height:1}
.oy{background:#80FF20;color:#000}.ono{background:#B3261E;color:#fff}.oc{background:#3E3E44;color:#D8D8DC}
.brow{display:grid;grid-template-columns:1.3fr 1fr 210px;gap:20px;align-items:center}
.bbar .xpw{padding-top:26px}.bbar .xpn{font-size:20px;-webkit-text-stroke:5px #000}
.bb2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bb2 .mbtn{height:48px}
.crow{display:grid;grid-template-columns:1.25fr 1.1fr 170px;gap:18px;align-items:center}
.cpc .pcs{height:52px;font-size:24px;padding:0 12px}
.cst{font-size:21px;text-align:right}
.cres{margin-top:8px;border-top:4px solid rgba(255,255,255,.07);padding-top:8px}
.ask{padding:4px 0 16px}.askl{font-size:24px;color:#fff;margin-bottom:8px}
.askrow{display:grid;grid-template-columns:1fr auto 110px;gap:10px;align-items:center;margin-bottom:6px}
.askrow .in{height:52px;display:flex;align-items:center;padding:0 14px;font-size:24px}.askrow .ph{color:#8E8E93}
.chips2{display:flex;gap:6px}.chips2 span{width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#ccc}.chips2 .on{color:#80FF20}
.askb{height:52px}
.pmA2 .askrow{grid-template-columns:1fr;}
.res3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}.res3 .mbtn{height:48px}

/* Viewer-asked questions that graduate into live polls (?pm3=1&role=viewer|streamer) */
.pmC3{margin-top:24px}
.pmC3 .subh{margin-top:18px;font-size:24px;color:#EDEDED}
.pmC3 .subh .small{color:var(--mute)}
.askrow3{display:grid;grid-template-columns:1fr 200px;gap:10px;margin-bottom:6px}
.askrow3 .in{height:52px;display:flex;align-items:center;padding:0 14px;font-size:24px}.askrow3 .ph{color:#8E8E93}
.askrow3 .mbtn{height:52px;font-size:14px}

<body>
<script>
const q = new URLSearchParams(location.search), OPT = q.get('opt') || 'A', SCR = q.get('screen') || 'coin';
const COINS = [
  {tk:'MIRA', by:'mira_plays', name:'Ranked till Diamond', mc:'$42.1K', ch:38.2, g:62, raised:'52.7', seed:3},
  {tk:'SHIP', by:'tomasz_codes', name:'Building a game in 24h', mc:'$71.9K', ch:71.5, g:88, raised:'74.8', seed:11},
  {tk:'OKO', by:'dj_okoro', name:'Sunday vinyl set', mc:'$28.4K', ch:12.4, g:41, raised:'34.9', seed:7},
  {tk:'LENA', by:'lena.irl', name:'Tokyo night walk', mc:'$22.0K', ch:-2.3, g:33, raised:'28.1', seed:19},
  {tk:'PAULA', by:'pixelpaula', name:'Speedrun any% in one night', mc:'$13.6K', ch:-6.1, g:18, raised:'15.3', seed:5},
  {tk:'RAMEN', by:'chef_ren', name:'Ramen from scratch', mc:'$9.8K', ch:4.0, g:9, raised:'7.7', seed:23},
];
const TRADES = [['Buy','1.20','28,510','7xKp3f','4s'],['Buy','0.50','11,870','Gq91Lm','9s'],['Sell','0.80','19,240','Bn4tZe','15s'],['Buy','2.00','47,920','mR8vYd','22s'],['Buy','0.10','2,401','Hc2wQa','31s'],['Sell','0.35','8,590','7xKp3f','48s']];
const pct = c => (c >= 0 ? '+' : '') + c.toFixed(1) + '%', cls = c => c >= 0 ? 'up' : 'down';
function rng(s){return()=>(s=(s*16807)%2147483647)/2147483647}

// ---------- original 16x16 procedural textures ----------
function tex(kind, seed=1){
  const c = document.createElement('canvas'); c.width = c.height = 16; const x = c.getContext('2d'), r = rng(seed*977+kind.length*31);
  const P = {
    dirt:['#866043','#79553A','#593D29','#9B7653','#6C4D36'],
    darkdirt:['#3d2b1e','#36261a','#2a1d13','#45311f','#30221a'],
    stone:['#7F7F7F','#747474','#8F8F8F','#686868','#9A9A9A'],
    deep:['#2f2f34','#28282c','#38383e','#222225','#333338'],
    grass:['#5D9B3A','#6AAA40','#4E8A32','#7CBD4C'],
  };
  if (kind === 'planks'){
    const pl = ['#A2834F','#9C7E4A','#B8945F','#AE8A55'];
    for(let y=0;y<16;y++)for(let i=0;i<16;i++){x.fillStyle=pl[(r()*4)|0];x.fillRect(i,y,1,1)}
    x.fillStyle='#6B5130';for(let y=3;y<16;y+=4)x.fillRect(0,y,16,1);
    [[5,0],[12,4],[2,8],[9,12]].forEach(([a,b])=>x.fillRect(a,b,1,3));
    return c.toDataURL();
  }
  if (kind === 'grassside'){
    const d = P.dirt; for(let y=0;y<16;y++)for(let i=0;i<16;i++){x.fillStyle=d[(r()*5)|0];x.fillRect(i,y,1,1)}
    for(let i=0;i<16;i++){const h=3+((r()*3)|0);for(let y=0;y<h;y++){x.fillStyle=P.grass[(r()*4)|0];x.fillRect(i,y,1,1)}}
    return c.toDataURL();
  }
  const p = P[kind]; for(let y=0;y<16;y++)for(let i=0;i<16;i++){x.fillStyle=p[(r()*p.length)|0];x.fillRect(i,y,1,1)}
  return c.toDataURL();
}

// ---------- original pixel sprites ----------
const SPR = {
  coin:['....aaaa....','..aabbbbaa..','.abbccccbba.','.abccddccba.','abccdccdccba','abcddccddcba','abcdccccdcba','abccdccdccba','.abccddccba.','.abbccccbba.','..aabbbbaa..','....aaaa....'],
  unv:['.aaaaaaa.','abbbbbbba','abbcccbba','abcbbbcba','abbbbcbba','abbbcbbba','abbbbbbba','abbbcbbba','.aaaaaaa.'],
  heart:['.aa...aa.','abba.abba','abbbabbba','abbbbbbba','.abbbbba.','..abbba..','...aba...','....a....'],
  pick:['.....aaaa.','....abbbba','.....aaaba','......acba','.....acaba','....aca.a.','...aca....','..aca.....','.aca......','aaa.......'],
  img:['aaaaaaaaaa','abbbbbbbba','abbbbccbba','abbbbccbba','abbbbbbbba','abdbbbbbba','addbbbbdba','adddbbddda','adddddddda','aaaaaaaaaa'],
};
const SC = {unv:{a:'#000',b:'#5A5A62',c:'#EDEDED'},coin:{a:'#3b2a00',b:'#c98f00',c:'#ffd23f',d:'#fff3a8'},heart:{a:'#2b0000',b:'#e0352b'},pick:{a:'#1d1d1d',b:'#47e0d0',c:'#8a6a3a'},img:{a:'#1d1d1d',b:'#9fd3ff',c:'#ffe066',d:'#4e8a32'}};
function sprite(name, cls=''){return `<canvas class="${cls}" data-spr="${name}"></canvas>`}
function drawSprites(){document.querySelectorAll('canvas[data-spr]').forEach(cv=>{const m=SPR[cv.dataset.spr],col=SC[cv.dataset.spr];cv.width=m[0].length;cv.height=m.length;const x=cv.getContext('2d');m.forEach((row,y)=>[...row].forEach((ch,i)=>{if(col[ch]){x.fillStyle=col[ch];x.fillRect(i,y,1,1)}}))})}

// ---------- blocky "game stream" stand-in, drawn low-res ----------
function scene(cv, seed){
  const W=cv.width,H=cv.height,x=cv.getContext('2d'),r=rng(seed*7919+13);
  const pals=[['#1d3b8f','#e94f37','#f6c90e','#3fb950','#7b2cbf','#00b4d8'],['#264653','#2a9d8f','#e9c46a','#f4a261','#e76f51','#8ecae6'],['#3a0ca3','#f72585','#4cc9f0','#ffbe0b','#06d6a0','#ef476f']];
  const p=pals[seed%3]; x.fillStyle=p[0]; x.fillRect(0,0,W,H);
  for(let i=0;i<5;i++){x.fillStyle=p[(i+1)%6];x.fillRect(0,Math.round(H*(.35+i*.13)),W,Math.ceil(H*.13))}
  for(let i=0;i<90;i++){x.fillStyle=p[(r()*6)|0];const s=Math.max(1,Math.round(r()*W/14));x.fillRect((r()*W)|0,(r()*H)|0,s,Math.max(1,Math.round(s*(.5+r()))))}
  x.fillStyle='#e94f37';x.fillRect(Math.round(W*.36),H-Math.round(H*.07),Math.round(W*.2),Math.max(1,Math.round(H*.025)));
}

// pixel stair-step chart on a low-res canvas
function chart(cv, color){
  const W=cv.width,H=cv.height,x=cv.getContext('2d'),r=rng(101);let v=30,pts=[];
  for(let i=0;i<W/3;i++){v+=(r()-.38)*6;v=Math.max(4,v);pts.push(v)}
  const mx=Math.max(...pts),mn=Math.min(...pts);x.fillStyle=color;
  let py=null;pts.forEach((p,i)=>{const y=Math.round(H-3-(p-mn)/(mx-mn)*(H-6));if(py!==null){for(let k=Math.min(py,y);k<=Math.max(py,y);k++)x.fillRect(i*3,k,2,2)}x.fillRect(i*3,y,3,2);py=y});
}

const sc = (seed,w,h) => `<canvas class="scene" data-seed="${seed}" width="${w}" height="${h}"></canvas>`;
const xp = (g, sm) => `<div class="xp${sm?' sm':''}"><b style="width:${g}%"></b><i></i></div>`;
const topBar = () => `<div class="top" data-tex="${OPT==='B'?'deep':'grassside'}"><div class="brand">${sprite('coin')}<span class="wm">memestream</span><span class="net">Devnet</span></div><div class="wallet">${sprite('heart')}<span class="num">7xKp3f</span></div></div>`;

const UNV = q.get('unv');
const TIP = `<div class="tip">We haven't checked that this streamer owns the channel.</div>`;
const unvTag = (tip) => `<span class="unvtag">Unverified${tip?TIP:''}</span>`;
const unvIcon = (tip) => `<span class="unvic">${sprite('unv')}${tip?TIP:''}</span>`;
const PM = q.get('pm') || q.get('pm3') || q.get('pm4');
const LB = [['7xKp3f',4210],['Gq91Lm',3380],['mR8vYd',2950],['Hc2wQa',1720],['Bn4tZe',1405]];
const MK = [
  {q:'Will I eat a banana on stream?', t:'4m 10s', y:72, yp:'1,440', np:'560', st:'100 on Yes'},
  {q:'Diamond rank tonight?', t:'38m', y:41, yp:'820', np:'1,180', st:''},
  {q:'Will chat make me sing?', t:'1h 12m', y:23, yp:'230', np:'770', st:'50 on No'}];
const RES = [['First game a win?','Yes','You won 120','up'],['Rage quit before 8 pm?','No','You lost 100','mute'],['Pet on camera?','Cancelled','Refunded','mute']];
const ROLE = q.get('role') || 'viewer';
const outTag = (o) => `<span class="otag ${o==='Yes'?'oy':o==='No'?'ono':'oc'}">${o}</span>`;
const lb5 = () => LB.map((r,i)=>`<div class="lbr num"><span class="mute">${i+1}</span><span>${r[0]}</span><span class="r">${r[1].toLocaleString()}</span></div>`).join('') + `<div class="lbr num you"><span class="mute">12</span><span>You</span><span class="r">800</span></div>`;
const askForm = (compact) => `<div class="ask${compact?' cmp':''}"><div class="askl">Ask your viewers</div><div class="askrow"><div class="slot in"><span class="ph">Will I eat a banana on stream?</span></div>
  <div class="chips2"><span class="slot">5m</span><span class="slot on">15m</span><span class="slot">1h</span><span class="slot">24h</span></div><div class="mbtn buy askb">Ask</div></div><div class="mute small">3 of 5 open. 12 of 60 asked this stream.</div></div>`;
const closedRow = () => `<div class="mk closed"><div class="mq">Will chat pick the sword?</div><div class="mute small num">Closed. 1,240 points staked. Resolve within 24 h or it cancels.</div>
  <div class="res3"><div class="mbtn buy">Yes</div><div class="mbtn no">No</div><div class="mbtn off">Cancel</div></div></div>`;
function predict2(c){
  const V = ROLE === 'viewer', free = '<div class="pfree">Free points. No money, no prizes.</div>';
  const head = `<div class="phead"><h3>Predictions</h3><span class="num">${V?'Your points 800':'You can\'t stake on your own questions'}</span></div>`;
  const resolved = (cls) => `<div class="${cls}"><div class="subh">Resolved</div>${RES.map(r=>`<div class="rr num"><span>${r[0]}</span>${outTag(r[1])}<span class="${r[3]} r">${V?r[2]:''}</span></div>`).join('')}</div>`;
  if (PM2 === 'A') {
    const card = m => `<div class="mk card"><div class="mq">${m.q}</div><div class="mute small num">${m.auto?'Automatic. ':''}Closes in ${m.t}</div>
      <div class="split"><b style="width:${m.y}%"></b></div><div class="prow num"><span class="up">Yes ${m.y}%  ${m.yp}</span><span class="down">${m.np}  No ${100-m.y}%</span></div>
      ${V?`<div class="prow num"><span class="mute">Your stake</span><span>${m.st||'None'}</span></div><div class="tabs"><div class="mbtn buy">Yes</div><div class="mbtn no">No</div></div>`:''}</div>`;
    return `<div class="pmA2"><div class="p pm">${head}${V?'':askForm()}${V?'':closedRow()}${MK.map(card).join('')}${free}</div>
      <div><div class="p pm"><h3>Leaderboard</h3>${lb5()}</div><div class="p pm" style="margin-top:24px">${resolved('')}</div></div></div>`;
  }
  if (PM2 === 'B') {
    const row = m => `<div class="mk brow"><div><div class="mq">${m.q}</div><div class="mute small num">${m.auto?'Automatic. ':''}Closes in ${m.t}${V&&m.st?'. You: '+m.st:''}</div></div>
      <div class="bbar"><div class="xpw"><div class="xpn num">Yes ${m.y}%</div><div class="xp sm"><b style="width:${m.y}%"></b><i></i></div></div></div>
      ${V?`<div class="bb2"><div class="mbtn sy">Yes</div><div class="mbtn sn">No</div></div>`:''}</div>`;
    return `<div class="p pm pmB2">${head}<div class="ptabs"><span class="on hf">Open 3</span><span class="hf">Resolved</span><span class="hf">Leaderboard</span></div>
      ${V?'':askForm(1)}${V?'':closedRow()}${MK.map(row).join('')}${free}</div>`;
  }
  const row = m => `<div class="mk crow"><div class="cq"><div class="mq">${m.q}</div><div class="mute small num">${m.auto?'Automatic. ':''}Closes in ${m.t}</div></div>
      <div class="pc cpc"><div class="slot pcs"><b class="y" style="width:${m.y}%"></b><span>Yes</span><span class="num">${m.y}%</span></div><div class="slot pcs"><b class="n" style="width:${100-m.y}%"></b><span>No</span><span class="num">${100-m.y}%</span></div></div>
      <div class="cst num ${m.st?'':'mute'}">${V?(m.st||'Tap to stake 100'):''}</div></div>`;
  return `<div class="p pm pmC2">${head}${V?'':askForm(1)}${V?'':closedRow()}${MK.map(row).join('')}${resolved('cres')}${free}
    <div class="lbline num"><span class="mute">Top points</span>1 7xKp3f 4,210<i class="tsep"></i>2 Gq91Lm 3,380<i class="tsep"></i>3 mR8vYd 2,950<i class="tsep"></i><span class="up">You 800, 12th</span></div></div>`;
}
const PM2 = q.get('pm2'), PM3 = q.get('pm3');
function predict4(c){
  const V = ROLE === 'viewer';
  const head = `<div class="phead"><h3>Predictions</h3><span class="num">${V?'Your points 780. You earn points by watching.':'You can\'t bet on your own coin'}</span></div>`;
  const yes = 41;
  const live = `<div class="livecard"><div class="lchead"><span class="lctag">Live</span><span class="num lct">1:42 left</span></div>
    <div class="mq big">Will she hit Diamond tonight?</div>
    <div class="pc cpc2"><div class="slot pcs"><b class="y" style="width:${yes}%"></b><span>Yes ${yes}%</span><span class="num">pays 2.4x</span></div>
      <div class="slot pcs"><b class="n" style="width:${100-yes}%"></b><span>No ${100-yes}%</span><span class="num">pays 1.7x</span></div></div>
    ${V?`<div class="lcbet"><div class="slot lamt num">50</div><span class="mute num">Tap Yes or No to bet 50</span><span class="num r">Your bet: 50 on Yes</span></div>`
       :`<div class="res3"><div class="mbtn buy">Resolve Yes</div><div class="mbtn no">Resolve No</div><div class="mbtn off">Cancel</div></div>`}</div>`;
  const Q = [['Will he play the banana song?',5],['Pet on camera before 10 pm?',3],['Rage quit this game?',1]];
  const queue = Q.map(r=>`<div class="mk qrow"><span class="mq">${r[0]}</span><span class="mute num">${r[1]} upvote${r[1]>1?'s':''}</span>
      ${V?`<div class="mbtn uv">Upvote</div>`:`<div class="qb"><div class="mbtn buy">Launch</div><div class="mbtn off">Remove</div></div>`}</div>`).join('');
  const win = V?'':`<div class="winrow"><span class="mute">Window</span><div class="chips2"><span class="slot">1m</span><span class="slot on">2m</span><span class="slot">5m</span><span class="slot">10m</span></div></div>`;
  const suggest = V?`<div class="askrow3"><div class="slot in"><span class="ph">Suggest a yes/no question</span></div><div class="mbtn buy askb">Suggest, 10 points</div></div>`:'';
  const R = [['First game a win?','Yes','You won 120','up',''],['Will he cry at the ending?','No','You lost 50','mute','disp'],['Stream past midnight?','Cancelled','Refunded','mute','']];
  const resolved = R.map(r=>`<div class="rr4 num"><span>${r[0]}</span>${outTag(r[1])}${r[4]?'<span class="otag oc dsp">Disputed</span>':'<span></span>'}<span class="${r[3]} r">${V?r[2]:''}</span>${V?'<span class="flag">Flag</span>':'<span></span>'}</div>`).join('');
  return `<div class="p pm pmC3">${head}${live}
    <div class="subh">Up next <span class="small">(the top question with 3 or more upvotes goes live next)</span></div>${win}${queue}${suggest}
    <div class="subh">Resolved</div>${resolved}
    <div class="pfree">Free points. No money, no prizes.</div>
    <div class="lbline num"><span class="mute">Top points</span>1 7xKp3f 4,210<i class="tsep"></i>2 Gq91Lm 3,380<i class="tsep"></i>3 mR8vYd 2,950<i class="tsep"></i><span class="up">You 780, 12th</span></div></div>`;
}
function predict3(c){
  const V = ROLE === 'viewer';
  const head = `<div class="phead"><h3>Predictions</h3><span class="num">${V?'Your points 780':'You can\'t take part on your own coin'}</span></div>`;
  const ask = V ? `<div class="askrow3"><div class="slot in"><span class="ph">Ask a yes/no question</span></div><div class="mbtn buy askb">Ask, 20 points</div></div>` : '';
  const LIVE = [{q:'Will she hit Diamond tonight?', t:'12m', y:64, pos:'12 Yes shares'},{q:'Will chat make her sing?', t:'3m 40s', y:23, pos:''}];
  const live = LIVE.map(m => `<div class="mk lrow"><div class="lq"><div class="mq">${m.q}</div><div class="mute small num">Live poll. Closes in ${m.t}${V&&m.pos?'. You hold '+m.pos:''}</div></div>
    ${V?`<div class="ltrade"><div class="pc cpc"><div class="slot pcs"><b class="y" style="width:${m.y}%"></b><span>Buy Yes</span><span class="num">${m.y}%</span></div><div class="slot pcs"><b class="n" style="width:${100-m.y}%"></b><span>Buy No</span><span class="num">${100-m.y}%</span></div></div>
      <div class="slot lamt num">50</div>${m.pos?'<div class="mbtn off lsell">Sell</div>':'<div class="lsell"></div>'}</div>`
      :`<div class="ltrade"><div class="pc cpc"><div class="slot pcs"><b class="y" style="width:${m.y}%"></b><span>Yes</span><span class="num">${m.y}%</span></div><div class="slot pcs"><b class="n" style="width:${100-m.y}%"></b><span>No</span><span class="num">${100-m.y}%</span></div></div></div>`}</div>`).join('');
  const RISE = [{q:'Will he play the banana song?', n:7, t:'18m'},{q:'Pet on camera before 10 pm?', n:4, t:'26m'},{q:'Rage quit this game?', n:2, t:'9m'}];
  const seg = n => `<span class="seg10">${Array.from({length:10},(_,i)=>`<i class="${i<n?'f':''}"></i>`).join('')}</span>`;
  const rising = RISE.map(m => `<div class="mk rrow"><div><div class="mq">${m.q}</div><div class="mute small num">${m.t} left to reach 10</div></div>

  const resolved = [['First game a win?','Yes','You won 120','up'],['Will he cry at the ending?','No','You lost 50','mute'],['Stream past midnight?','Cancelled','Refunded','mute']]
    .map(r=>`<div class="rr num"><span>${r[0]}</span>${outTag(r[1])}<span class="${r[3]} r">${V?r[2]:''}</span></div>`).join('');
  const toResolve = V ? '' : `<div class="mk closed"><div class="mq">Will chat pick the sword?</div><div class="mute small num">Poll closed. Resolve within 24 h or it cancels.</div><div class="res3"><div class="mbtn buy">Yes</div><div class="mbtn no">No</div><div class="mbtn off">Cancel</div></div></div>`;
  return `<div class="p pm pmC3">${head}${ask}${toResolve}
    <div class="subh">Live polls</div>${live}
    <div class="subh">Rising <span class="small">(10 upvotes in 30 min make a live poll)</span></div>${rising}
    <div class="subh">Resolved</div>${resolved}
    <div class="pfree">Free points. No money, no prizes.</div>
    <div class="lbline num"><span class="mute">Top points</span>1 7xKp3f 4,210<i class="tsep"></i>2 Gq91Lm 3,380<i class="tsep"></i>3 mR8vYd 2,950<i class="tsep"></i><span class="up">You 780, 12th</span></div></div>`;
}
function predict(c){
  if (q.get('pm4')) return predict4(c);
  if (PM3) return predict3(c);
  if (PM2) return predict2(c);
  if (!PM) return '';
  const yes = 64, free = '<div class="pfree">Free points. No money, no prizes.</div>';
  const q1 = `<div class="pq">Will $${c.tk} graduate before 9 pm?</div><div class="pclock mute num">Closes in 1h 12m</div>`;
  const stake = `<div class="prow num"><span class="mute">Your stake</span><span>200 on Yes</span></div><div class="prow num"><span class="mute">Your points</span><span>800</span></div>`;
  const amt = `<div class="pamt"><div class="slot amt num">100<small>points</small></div></div>`;
  const lbRows = (n) => LB.slice(0,n).map((r,i)=>`<div class="lbr num"><span class="mute">${i+1}</span><span>${r[0]}</span><span class="r">${r[1].toLocaleString()}</span></div>`).join('') + `<div class="lbr num you"><span class="mute">12</span><span>You</span><span class="r">800</span></div>`;
  if (PM === 'A') return `<div class="pmA"><div class="p pm">${q1}
      <div class="split"><b style="width:${yes}%"></b><i></i></div>
      <div class="prow num"><span class="up">Yes ${yes}%  6,400</span><span class="down">3,600  No ${100-yes}%</span></div>
      ${stake}${amt}<div class="tabs"><div class="mbtn buy">Yes</div><div class="mbtn no">No</div></div>${free}</div>
    <div class="p pm"><h3>Leaderboard</h3>${lbRows(5)}</div></div>`;
  if (PM === 'B') return `<div class="p pm pmB"><div class="ptabs"><span class="on hf">Predict</span><span class="hf">Leaderboard</span></div>
      <div class="pcols"><div>${q1}<div class="xpw"><div class="xpn num">Yes ${yes}%</div>${xp(yes)}</div>
      <div class="prow num"><span class="mute">Yes 6,400 points</span><span class="mute">No 3,600 points</span></div></div>
      <div>${stake}${amt}<div class="tabs"><div class="mbtn sy">Yes</div><div class="mbtn sn">No</div></div></div></div>${free}</div>`;
  return `<div class="p pm pmC">${q1}
      <div class="pc"><div class="slot pcs"><b class="y" style="width:${yes}%"></b><span>Yes</span><span class="num">${yes}%</span></div>
      <div class="slot pcs"><b class="n" style="width:${100-yes}%"></b><span>No</span><span class="num">${100-yes}%</span></div></div>
      <div class="prow num"><span class="mute">Tap Yes or No to stake</span><span>100 points</span></div>
      ${stake}${free}
      <div class="lbline num"><span class="mute">Top points</span>1 7xKp3f 4,210<i class="tsep"></i>2 Gq91Lm 3,380<i class="tsep"></i>3 mR8vYd 2,950<i class="tsep"></i><span class="up">You 800, 12th</span></div></div>`;
}
function coinPage(){

  return topBar() + `<div class="coin">
    <div><div class="embed">${sc(c.seed,192,108)}<span class="live">Live</span></div>
      <div class="p" style="margin-top:24px"><div class="ident"><div class="slot">${sc(c.seed,16,16)}</div><div><h1>$${c.tk}${UNV==='A'?unvTag(1):UNV==='C'?unvIcon(1):''}</h1><p>${c.name} by ${UNV?'5NSMpd':c.by}</p>${UNV==='B'?'<p class="unvline">Unverified. We haven\'t checked that this streamer owns the channel.</p>':''}</div></div>
      <div class="trades"><h3>Recent trades</h3>${trades}</div></div>${predict(c)}</div>
    <div style="display:flex;flex-direction:column;gap:24px">
      <div class="p"><div class="lbl mute">Market cap</div><div class="cap num">${c.mc}</div><div class="chg up num">${pct(c.ch)} in the last hour</div>
        <div class="chart"><canvas data-chart width="132" height="40"></canvas></div>
        <div class="gradlbl"><span>Graduation</span><span class="mute num">${c.raised} of 85 SOL</span></div>
        <div class="xpw"><div class="xpn num">${c.g}%</div>${xp(c.g)}</div>

      <div class="p"><div class="tabs"><div class="mbtn buy">Buy</div><div class="mbtn off">Sell</div></div>

        <div class="chips num"><span class="slot">0.1</span><span class="slot">0.5</span><span class="slot">1</span><span class="slot">Max</span></div>

        <div class="mbtn buy">Buy ${c.tk}</div></div>
    </div></div>`;
}

const TAPE = q.get('tape');
const sep = '<i class="tsep"></i>';
const mini = g => `<span class="tbar"><b style="width:${g}%"></b></span>`;
function tape(){
  if (!TAPE) return '';
  let items;
  if (TAPE === 'A') items = COINS.map(c => `<a class="ti"><span class="tthumb">${sc(c.seed,16,9)}</span><b>$${c.tk}</b><span class="num">${c.mc}</span></a>`);
  if (TAPE === 'B') items = [
    `<a class="ti"><span class="mute">7xKp3f</span><span class="up">bought</span><span class="num">0.5 SOL</span>of <b>$MIRA</b></a>`,
    `<a class="ti grad">${sprite('coin')}<b>$SHIP</b> graduated to Meteora</a>`,
    `<a class="ti"><span class="mute">ApF7Vq</span><span class="down">sold</span><span class="num">0.2 SOL</span>of <b>$LENA</b></a>`,
    `<a class="ti"><span class="mute">Gq91Lm</span><span class="up">bought</span><span class="num">1.2 SOL</span>of <b>$OKO</b></a>`,
    `<a class="ti"><span class="mute">mR8vYd</span><span class="up">bought</span><span class="num">0.1 SOL</span>of <b>$RAMEN</b></a>`];
  if (TAPE === 'C') items = [COINS[1],COINS[0],COINS[2],COINS[3],COINS[4],COINS[5]].map(c => `<a class="ti"><b>$${c.tk}</b>${mini(c.g)}<span class="num xpt">${c.g}%</span></a>`);
  items.splice(TAPE==='C'?2:3, 0, TAPE==='C' ? `<a class="ti grad">${sprite('coin')}<b>$DVZ7PP78</b> graduated</a>` : '');
  return `<div class="tape"><div class="trow">${items.filter(Boolean).concat(items.filter(Boolean)).join(sep)}</div></div>`;
}
function home(){
  const hero = `<div class="hero"><div><h1>Live coins</h1><p>Buy the stream you think will pop.</p></div><div class="mbtn">Go live</div></div>
    <div class="sort"><div class="mbtn">Hot</div><div class="mbtn off">New</div><div class="mbtn off">Close to graduation</div></div>`;
  if (OPT === 'B') return topBar() + tape() + `<div class="home">${hero}<div class="grid">${COINS.map(c=>`<div class="p tile"><div class="slot">${sc(c.seed,96,54)}<span class="tags"><span class="live">Live</span>${UNV==='A'?unvTag():''}</span></div>
    ${UNV ? `<div class="m2"><h4>$${c.tk}${UNV==='C'?unvIcon():''}</h4><h4 class="num">${c.mc}</h4></div><div class="m2 r2"><p>${c.name}</p>${UNV==='B'?'<p class="unvw">Unverified</p>':''}</div>`
      : `<div class="meta"><div><h4>$${c.tk}</h4><p>${c.name}</p></div><div style="text-align:right"><h4 class="num">${c.mc}</h4><p class="num ${cls(c.ch)}">${pct(c.ch)}</p></div></div>`}${xp(c.g,1)}</div>`).join('')}</div></div>`;
  return topBar() + `<div class="home">${hero}<div class="p">${COINS.map(c=>`<div class="row"><div class="slot">${sc(c.seed,48,27)}</div>
    <div><h4>$${c.tk}</h4><p>${c.name} by ${c.by}</p></div><div class="m num">${c.mc}</div><div class="c num ${cls(c.ch)}">${pct(c.ch)}</div>
    <div class="g num"><div style="margin-bottom:6px">${c.g}% to graduation</div>${xp(c.g,1)}</div></div>`).join('')}</div></div>`;
}

function goLive(){
  return topBar() + `<div class="form"><div class="p" style="padding:32px">
    <h1>Go live</h1><div class="sub mute">Launch a coin for this stream in one transaction.</div>
    <div class="two"><div class="f"><label>Image</label><div class="slot drop">${sprite('img')}Add image</div></div>

    <div class="mbtn buy">Launch coin</div></div></div>`;
}

// ---------- OBS overlay (week 2, style B). v=A panel / B top strip / C hotbar ----------
function overlay(){
  const c = COINS[0], v = q.get('v') || 'A', ph = q.get('phase') || 'live';
  const bg = `<canvas class="scene ovbg" data-seed="${c.seed+2}" width="240" height="135"></canvas>`;
  const done = ph === 'grad';
  const bar = (big) => done
    ? `<div class="xpw"><div class="xpn">Graduated</div><div class="xp${big?' big':''}"><b style="width:100%"></b><i></i></div></div>`
    : `<div class="xpw"><div class="xpn num">${c.g}%</div><div class="xp${big?' big':''}"><b style="width:${c.g}%"></b><i></i></div></div>`;
  if (v === 'A') return bg + `<div class="p ovA"><div class="oh"><div class="slot">${sprite('coin')}</div><div><div class="tk hf">$${c.tk}</div><div class="where">memestream.lol/mira</div></div>
    <div class="r"><div class="mc hf num">${c.mc}</div><div class="ch up num">${pct(c.ch)}</div></div></div>${bar()}<div class="gl">${done?'Now trading on Meteora':'to graduation'}</div></div>`;
  if (v === 'B') return bg + `<div class="p ovB"><div class="slot">${sprite('coin')}</div><div class="tk hf">$${c.tk}</div><div class="mc hf num">${c.mc}</div><div class="ch up num">${pct(c.ch)}</div>
    <div class="w">${bar()}</div><div class="where">memestream.lol/mira</div></div>`;
  return bg + `<div class="ovC">${bar(true)}<div class="hot">
    <div class="slot s1">${sprite('coin')}<span class="hf">$${c.tk}</span></div><div class="slot s2"><span class="hf num">${c.mc}</span></div>
    <div class="slot s3"><span class="up num">${pct(c.ch)}</span></div><div class="slot s4"><span>memestream.lol/mira</span></div></div></div>`;
}

document.body.className = OPT;
if (SCR === 'overlay') document.body.classList.add('ov');

if (pageTex) document.body.style.backgroundImage = `url(${tex(pageTex,4)})`;

if (SCR === 'overlay') document.body.style.backgroundImage = 'none';

if (OPT !== 'B') document.querySelectorAll('.mbtn:not(.buy):not(.off)').forEach(e => e.style.cssText += `;background-image:url(${tex('stone',6)});background-size:64px 64px`);
document.querySelectorAll('canvas.scene').forEach(c => scene(c, +c.dataset.seed));
document.querySelectorAll('canvas[data-chart]').forEach(c => chart(c, {A:'#2E8B22',B:'#80FF20',C:'#2E1F0E'}[OPT]));
drawSprites();
</script>
